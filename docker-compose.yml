services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: webblock_api
    restart: always
    ports:
      - "${SERVER_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AGENT_API_KEY=${AGENT_API_KEY:-wb_agent_secret_2026}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-wb_admin_secret_2026}
      - LATEST_AGENT_VERSION=${LATEST_AGENT_VERSION:-1.0.6}

  dashboard:
    build:
      context: ./dashboard/webblockfront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_ADMIN_KEY: ${NEXT_PUBLIC_ADMIN_KEY:-wb_admin_secret_2026}
    container_name: webblock_dashboard
    restart: always
    ports:
      - "${DASHBOARD_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ADMIN_KEY=${NEXT_PUBLIC_ADMIN_KEY:-wb_admin_secret_2026}
    depends_on:
      - server
