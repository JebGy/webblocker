services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: webblock_api
    restart: always
    ports:
      - "${SERVER_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AGENT_API_KEY=${AGENT_API_KEY:-wb_agent_secret_2026}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-wb_admin_secret_2026}
      - LATEST_AGENT_VERSION=${LATEST_AGENT_VERSION:-1.0.8}

  dashboard:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: webblock_dashboard
    restart: always
    command: streamlit run dashboard_streamlit.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - server
